<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>GraphiQL</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="stylesheet"
      href="https://esm.sh/graphiql@5.2.4/dist/style.css"
    />
    <link
      rel="stylesheet"
      href="https://esm.sh/@graphiql/plugin-explorer@5.1.3/dist/style.css"
    />
    <style>
      body {
        margin: 0;
      }
      #graphiql {
        height: 100vh;
      }
    </style>
    <!--
      The ?standalone flag bundles each module with its dependencies (excluding
      peerDependencies) into a single file, so every package shares the same
      react / graphql / monaco instances. @emotion/is-prop-valid is shimmed to
      silence a harmless "module not found" console error.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.2.7",
          "react/": "https://esm.sh/react@19.2.7/",
          "react-dom": "https://esm.sh/react-dom@19.2.7",
          "react-dom/": "https://esm.sh/react-dom@19.2.7/",
          "graphiql": "https://esm.sh/graphiql@5.2.4?standalone&external=react,react-dom,@graphiql/react,graphql",
          "graphiql/": "https://esm.sh/graphiql@5.2.4/",
          "@graphiql/plugin-explorer": "https://esm.sh/@graphiql/plugin-explorer@5.1.3?standalone&external=react,@graphiql/react,graphql",
          "@graphiql/react": "https://esm.sh/@graphiql/react@0.37.7?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
          "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql",
          "graphql": "https://esm.sh/graphql@17.0.2",
          "@emotion/is-prop-valid": "data:text/javascript,"
        }
      }
    </script>
  </head>
  <body>
    <div id="graphiql">Loading GraphiQL...</div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { GraphiQL } from "graphiql";
      import { createGraphiQLFetcher } from "@graphiql/toolkit";
      import { explorerPlugin } from "@graphiql/plugin-explorer";
      // Registers the Monaco editor web workers (and the JSON / GraphQL
      // language contributions GraphiQL 5 relies on). Without this the
      // variables editor fails with "monaco.languages.json is undefined".
      import "graphiql/setup-workers/esm.sh";

      const params = new URLSearchParams(location.search);
      const query = params.get("query") ?? "";
      const variables = params.get("variables") ?? "";
      const endpoint = params.get("endpoint") ?? "/graphql";

      const fetcher = createGraphiQLFetcher({
        url: new URL(endpoint, location.href).toString(),
      });

      const root = createRoot(document.getElementById("graphiql"));
      root.render(
        React.createElement(GraphiQL, {
          fetcher,
          initialQuery: query,
          initialVariables: variables,
          plugins: [explorerPlugin()],
        }),
      );
    </script>
  </body>
</html>
