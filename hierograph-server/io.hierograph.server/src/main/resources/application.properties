spring.ai.mcp.server.name=hierograph-graph
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

# Graph source (local MCP server per developer):
#   manifest = scan the modules listed in the build manifest on the fly and follow changes (default).
#              A build with the Hierograph Maven plugin (`create-descriptor`) writes the manifest;
#              launch the server from the project's build root.
#   parquet  = load a pre-built Parquet snapshot directory (CI / shared server); set
#              hierograph.graph.parquetDir to the snapshot location.
hierograph.graph.source=manifest
hierograph.graph.manifest=.hierograph/manifest.json

spring.graphql.graphiql.enabled=false
hierograph.memory-usage-logger.enabled=false

# Log every MCP tool call as a JSON record (via LoggingToolCallbackProvider). Off by default.
hierograph.tool-call-logger.enabled=false

# Write a debug dump of the hierarchical graph (hierograph.graph.dumpFile) on each build. Off by default.
hierograph.graph.dump.enabled=false

# manifest mode: also scan each module's test output as a separate `<gav>:test` artifact (origin
# MODULE_TEST). On by default; set to false to keep the graph production-only (roughly halves it).
hierograph.graph.include-tests=true

# Suppress harmless Spring AI MCP BeanPostProcessor warnings
logging.level.org.springframework.context.support.PostProcessorRegistrationDelegate=ERROR