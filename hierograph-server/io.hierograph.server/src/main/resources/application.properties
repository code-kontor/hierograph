spring.ai.mcp.server.name=hierograph-graph
# spring.ai.mcp.server.version defaults to the server's build version (set in main).
spring.ai.mcp.server.protocol=STREAMABLE

# Port of the MCP endpoint (http://localhost:<port>/mcp). 8765 rather than 8080, which JVM developers often
# use for Spring Boot, Tomcat or Jenkins. 0 picks a free port; the runtime file records the port in use.
server.port=8765

# Stop at once. A graceful shutdown waits for active requests, and an MCP client's event stream
# (GET /mcp) never completes: every stop with a client connected took the full timeout, and
# `docker stop` killed the JVM (exit 137). Nothing needs draining: tool calls are short reads, and
# the background work is cut off on shutdown anyway.
server.shutdown=immediate

# Per-workspace settings: Spring properties the workspace keeps for its server, for example a fixed
# server.port. Written once (by the bootstrap skill, or by hand) and read on every start; command-line
# arguments still override them.
spring.config.import=optional:file:${hierograph.graph.stateDir:.hierograph}/server.properties

# Instance settings:
#   hierograph.server.url        the MCP URL to advertise, when clients reach the server under another address
#                                (a container's port mapping); default http://localhost:<port>/mcp
#   hierograph.server.workspace  the workspace to report, when clients see the project under another path
#                                (a container's /workspace); default the build root
# Once ready, the server writes <state dir>/server.json (url, port, pid, version, workspace, ...) and deletes it
# on shutdown. A server refuses to start while server.json names another running server.
hierograph.server.runtime-file.enabled=true
hierograph.server.single-instance=true

# Graph source (local MCP server per developer):
#   manifest = scan the modules listed in the build manifest on the fly and follow changes (default).
#              A build with the Hierograph Maven plugin (`create-descriptor`) writes the manifest;
#              launch the server from the project's build root.
#   parquet  = load a pre-built Parquet snapshot directory (CI / shared server); set
#              hierograph.graph.parquetDir to the snapshot location.
hierograph.graph.source=manifest
hierograph.graph.manifest=.hierograph/manifest.json

spring.graphql.graphiql.enabled=false
hierograph.memory-usage-logger.enabled=false

# Log every MCP tool call as a JSON record (via LoggingToolCallbackProvider). Off by default.
hierograph.tool-call-logger.enabled=false

# Write a debug dump of the hierarchical graph (hierograph.graph.dumpFile) on each build. Off by default.
hierograph.graph.dump.enabled=false

# manifest mode: also scan each module's test output as a separate `<gav>:test` artifact (origin
# MODULE_TEST). On by default; set to false to keep the graph production-only (roughly halves it).
hierograph.graph.include-tests=true

# Suppress harmless Spring AI MCP BeanPostProcessor warnings
logging.level.org.springframework.context.support.PostProcessorRegistrationDelegate=ERROR