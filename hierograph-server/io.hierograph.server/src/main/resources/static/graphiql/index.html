<!DOCTYPE html>
<html lang="en">
<head>
    <title>GraphiQL - Hierograph</title>
    <style>
        body { height: 100%; margin: 0; width: 100%; overflow: hidden; }
        #graphiql { height: 100vh; }
    </style>
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/graphiql@3.7.2/graphiql.min.js" type="application/javascript"></script>
    <link rel="stylesheet" href="https://unpkg.com/graphiql@3.7.2/graphiql.min.css"/>
    <script src="https://unpkg.com/@graphiql/plugin-explorer@3.2.5/dist/index.umd.js" crossorigin></script>
    <link rel="stylesheet" href="https://unpkg.com/@graphiql/plugin-explorer@3.2.5/dist/style.css"/>
</head>
<body>
<div id="graphiql">Loading...</div>
<script>
    const url = `${location.protocol}//${location.host}/graphql`;
    const gqlFetcher = GraphiQL.createFetcher({url: url});
    const explorerPlugin = GraphiQLPluginExplorer.explorerPlugin();
    ReactDOM.render(
        React.createElement(GraphiQL, {
            fetcher: gqlFetcher,
            defaultVariableEditorOpen: true,
            headerEditorEnabled: true,
            shouldPersistHeaders: true,
            plugins: [explorerPlugin]
        }),
        document.getElementById('graphiql'),
    );
</script>
</body>
</html>
