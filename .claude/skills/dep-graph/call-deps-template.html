<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{TITLE}}</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1117; color: #c9d1d9; }
  svg { display: block; width: 100vw; height: 100vh; }
  .node-label { font-size: 11px; pointer-events: none; }
  .edge { fill: none; stroke-opacity: 0.35; }
  .edge.highlighted { stroke-opacity: 0.9; }
  .tooltip {
    position: absolute; background: #161b22; border: 1px solid #30363d;
    border-radius: 6px; padding: 10px 14px; font-size: 12px;
    pointer-events: none; opacity: 0; transition: opacity 0.15s;
    max-width: 360px; line-height: 1.6;
  }
  .tooltip .title { font-weight: 600; color: #58a6ff; margin-bottom: 4px; }
  .tooltip .row { display: flex; justify-content: space-between; gap: 12px; }
  .tooltip .kind { color: #8b949e; }
  .tooltip .count { color: #f0f6fc; font-weight: 500; }
  .legend {
    position: absolute; top: 16px; right: 16px; background: #161b22;
    border: 1px solid #30363d; border-radius: 6px; padding: 12px 16px; font-size: 11px;
  }
  .legend .item { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  .legend .swatch { width: 12px; height: 12px; border-radius: 3px; }
  h1 { position: absolute; top: 16px; left: 16px; font-size: 16px; font-weight: 600; color: #58a6ff; }
  .subtitle { position: absolute; top: 40px; left: 16px; font-size: 12px; color: #8b949e; }
</style>
</head>
<body>
<h1>{{TITLE}}</h1>
<div class="subtitle">{{SUBTITLE}}</div>
<div class="tooltip" id="tooltip"></div>
<div class="legend">
  <div class="item"><div class="swatch" style="background:#f78166"></div> Source (own)</div>
  <div class="item"><div class="swatch" style="background:#58a6ff"></div> Target</div>
  <div class="item"><div class="swatch" style="background:#3fb95060; border: 1px solid #3fb950"></div> Inherited source</div>
</div>
<svg id="graph"></svg>
<script>
// ---- DATA (replace this block) ----
// Each entry: { s: 'SourceClass', t: 'TargetClass', w: count }
// Mark inherited sources by appending '*' to the name.
const callEdges = {{EDGES}};

const inheritedMarker = '*';
// ---- END DATA ----

const sourceNames = [...new Set(callEdges.map(e => e.s))];
const targetNames = [...new Set(callEdges.map(e => e.t))];

const sourceTotals = {};
const targetTotals = {};
callEdges.forEach(e => {
  sourceTotals[e.s] = (sourceTotals[e.s] || 0) + e.w;
  targetTotals[e.t] = (targetTotals[e.t] || 0) + e.w;
});

sourceNames.sort((a, b) => (sourceTotals[b] || 0) - (sourceTotals[a] || 0));
targetNames.sort((a, b) => (targetTotals[b] || 0) - (targetTotals[a] || 0));

const inherited = new Set(sourceNames.filter(n => n.endsWith(inheritedMarker)));

const svg = document.getElementById('graph');
const W = window.innerWidth, H = window.innerHeight;
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
const tooltip = document.getElementById('tooltip');

const margin = { top: 80, bottom: 40 };
const usableH = H - margin.top - margin.bottom;

const srcX = W * 0.18;
const tgtX = W * 0.82;
const srcSpacing = Math.min(42, usableH / (sourceNames.length + 1));
const tgtSpacing = Math.min(32, usableH / (targetNames.length + 1));
const srcStartY = margin.top + (usableH - srcSpacing * (sourceNames.length - 1)) / 2;
const tgtStartY = margin.top + (usableH - tgtSpacing * (targetNames.length - 1)) / 2;

const srcPos = {};
const tgtPos = {};
sourceNames.forEach((s, i) => { srcPos[s] = { x: srcX, y: srcStartY + i * srcSpacing }; });
targetNames.forEach((t, i) => { tgtPos[t] = { x: tgtX, y: tgtStartY + i * tgtSpacing }; });

// Draw edges
const maxEdge = Math.max(...callEdges.map(e => e.w));
const edgeEls = [];

callEdges.forEach(e => {
  const s = srcPos[e.s], t = tgtPos[e.t];
  if (!s || !t) return;
  const sw = Math.max(1, (e.w / maxEdge) * 8);
  const color = inherited.has(e.s) ? '#3fb950' : '#f78166';

  const cp1x = s.x + (t.x - s.x) * 0.35;
  const cp2x = s.x + (t.x - s.x) * 0.65;

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', `M${s.x},${s.y} C${cp1x},${s.y} ${cp2x},${t.y} ${t.x},${t.y}`);
  path.setAttribute('class', 'edge');
  path.setAttribute('stroke', color);
  path.setAttribute('stroke-width', sw);
  path.dataset.source = e.s;
  path.dataset.target = e.t;
  path.dataset.weight = e.w;
  svg.appendChild(path);
  edgeEls.push({ el: path, source: e.s, target: e.t, weight: e.w, baseWidth: sw });
});

function highlightNode(name, side) {
  edgeEls.forEach(e => {
    const match = side === 'source' ? e.source === name : e.target === name;
    e.el.classList.toggle('highlighted', match);
    e.el.style.strokeOpacity = match ? 0.9 : 0.06;
    e.el.style.strokeWidth = match ? e.baseWidth + 1.5 : e.baseWidth;
  });
}
function resetHighlight() {
  edgeEls.forEach(e => {
    e.el.classList.remove('highlighted');
    e.el.style.strokeOpacity = '';
    e.el.style.strokeWidth = '';
  });
}

// Draw source nodes + labels
sourceNames.forEach(name => {
  const p = srcPos[name];
  const total = sourceTotals[name] || 0;
  const r = Math.max(5, Math.sqrt(total) * 2);
  const isInh = inherited.has(name);
  const color = isInh ? '#3fb950' : '#f78166';

  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', p.x);
  circle.setAttribute('cy', p.y);
  circle.setAttribute('r', r);
  circle.setAttribute('fill', color);
  circle.setAttribute('stroke', '#0d1117');
  circle.setAttribute('stroke-width', 1.5);
  if (isInh) circle.setAttribute('fill-opacity', 0.5);
  circle.style.cursor = 'pointer';
  circle.addEventListener('mouseenter', () => {
    highlightNode(name, 'source');
    const targets = callEdges.filter(e => e.s === name).map(e =>
      `<div class="row"><span class="kind">${e.t}</span><span class="count">${e.w}</span></div>`
    ).join('');
    tooltip.innerHTML = `<div class="title">${name} (${total} calls)</div>${targets}`;
    tooltip.style.opacity = 1;
  });
  circle.addEventListener('mousemove', e => {
    tooltip.style.left = e.pageX + 14 + 'px';
    tooltip.style.top = e.pageY - 10 + 'px';
  });
  circle.addEventListener('mouseleave', () => { resetHighlight(); tooltip.style.opacity = 0; });
  svg.appendChild(circle);

  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', p.x - r - 6);
  text.setAttribute('y', p.y + 4);
  text.setAttribute('text-anchor', 'end');
  text.setAttribute('class', 'node-label');
  text.setAttribute('fill', isInh ? '#3fb950' : '#c9d1d9');
  if (isInh) text.setAttribute('fill-opacity', 0.7);
  text.textContent = `${name} (${total})`;
  svg.appendChild(text);
});

// Draw target nodes + labels
targetNames.forEach(name => {
  const p = tgtPos[name];
  const total = targetTotals[name] || 0;
  const r = Math.max(4, Math.sqrt(total) * 1.8);

  const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  circle.setAttribute('cx', p.x);
  circle.setAttribute('cy', p.y);
  circle.setAttribute('r', r);
  circle.setAttribute('fill', '#58a6ff');
  circle.setAttribute('stroke', '#0d1117');
  circle.setAttribute('stroke-width', 1.5);
  circle.style.cursor = 'pointer';
  circle.addEventListener('mouseenter', () => {
    highlightNode(name, 'target');
    const sources = callEdges.filter(e => e.t === name).map(e =>
      `<div class="row"><span class="kind">${e.s}</span><span class="count">${e.w}</span></div>`
    ).join('');
    tooltip.innerHTML = `<div class="title">${name} (${total} incoming calls)</div>${sources}`;
    tooltip.style.opacity = 1;
  });
  circle.addEventListener('mousemove', e => {
    tooltip.style.left = Math.min(e.pageX + 14, W - 380) + 'px';
    tooltip.style.top = e.pageY - 10 + 'px';
  });
  circle.addEventListener('mouseleave', () => { resetHighlight(); tooltip.style.opacity = 0; });
  svg.appendChild(circle);

  const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  text.setAttribute('x', p.x + r + 6);
  text.setAttribute('y', p.y + 4);
  text.setAttribute('text-anchor', 'start');
  text.setAttribute('class', 'node-label');
  text.setAttribute('fill', '#c9d1d9');
  text.textContent = `${name} (${total})`;
  svg.appendChild(text);
});
</script>
</body>
</html>
