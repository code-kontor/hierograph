spring.ai.mcp.server.name=slizaa-graph
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STREAMABLE

slizaa.bolt.uri=bolt://localhost:7687
slizaa.memory-usage-logger.enabled=true

# Per-tool debug logging. Each tool gets its own flag as the need arises; for now only
# detail_dependencies. When true, the Cypher built for each invocation is logged at INFO.
slizaa.mcp.tools.detail-dependencies.log-cypher=true

# Suppress harmless Spring AI MCP BeanPostProcessor warnings
logging.level.org.springframework.context.support.PostProcessorRegistrationDelegate=ERROR